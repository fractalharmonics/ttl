<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown to April 28, 2026 at Noon ET</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f8fafc;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.25), transparent 35%),
        linear-gradient(180deg, #111827 0%, #020617 100%);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .target {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--accent);
    }

    .countdown {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .unit {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px 12px;
    }

    .value {
      display: block;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status {
      margin-top: 24px;
      font-size: 1rem;
      color: var(--accent);
      min-height: 1.5em;
    }

    .footer {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .card {
        padding: 24px 18px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Countdown</h1>
    <p>Time remaining until noon Eastern Time on April 28, 2026</p>
    <div class="target">April 28, 2026 • 12:00 PM ET</div>

    <section class="countdown" aria-label="Countdown timer">
      <div class="unit">
        <span class="value" id="days">0</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">0</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">0</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">0</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <div class="status" id="status">Calculating…</div>
    <div class="footer">This page uses a fixed UTC target so it stays accurate across time zones.</div>
  </main>

  <script>
    // April 28, 2026 at 12:00 PM Eastern Time.
    // In late April, Eastern Time is EDT (UTC-4), so the UTC time is 16:00:00.
    const targetTime = new Date('2026-04-28T16:00:00Z').getTime();

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const statusEl = document.getElementById('status');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetTime - now;

      if (diff <= 0) {
        daysEl.textContent = '0';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        statusEl.textContent = 'The countdown has ended.';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = String(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
      statusEl.textContent = 'Counting down in real time.';
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
